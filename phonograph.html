<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南十字留声机 | 末世回响</title>
    <link rel="icon" type="image/png" href="南十字Crux.png">
    <link rel="apple-touch-icon" href="南十字Crux.png">
    <style>
        /* ================= 基础全局与美术风格传承 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @media (pointer: fine) { * { cursor: none !important; } }

        html, body { height: 100vh; overscroll-behavior: none; }
        
        body {
            background: #040307;
            color: #e6e2ff;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        body::before {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle at 15% 20%, rgba(255,255,255,0.05), transparent 25%),
                        radial-gradient(circle at 85% 75%, rgba(173,84,255,0.08), transparent 25%),
                        linear-gradient(160deg, rgba(86,50,162,0.1), transparent 45%, rgba(3,2,8,0.8));
            pointer-events: none; z-index: -2;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,107,255,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,121,198,0.6); }

        /* 背景粒子层 */
        .particles { position:fixed; inset:0; pointer-events:none; z-index:-1; }
        .particle {
            position:absolute; width:4px; height:4px; border-radius:50%;
            background: radial-gradient(circle, #fff7ff 0%, #ffd9fb 40%, #a86bff 100%);
            opacity:0.8; transform: translate3d(0,0,0);
            box-shadow: 0 0 10px rgba(168,107,255,0.5);
            animation: floatAnim ease-in-out infinite alternate;
        }
        @keyframes floatAnim { 0% { transform: translate3d(0, 0, 0); opacity: 0.5; } 100% { transform: translate3d(10px, -15px, 0); opacity: 1; } }

        /* ================= 导航与顶栏 ================= */
        .top-nav {
            padding: 1.5rem 2.4rem; display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 10;
        }
        .back-btn {
            display: flex; align-items: center; gap: 8px; color: #ffd8fb; text-decoration: none;
            font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; opacity: 0.8;
            transition: all 0.3s ease;
        }
        .back-btn:hover { opacity: 1; text-shadow: 0 0 12px rgba(255,121,198,0.6); transform: translateX(-4px); }
        .back-icon { font-size: 1.2rem; margin-bottom: 2px; }

        .header-title { text-align: right; }
        .crux-word {
            font-family: "PingFang SC", 'Times New Roman', serif; font-weight: 600; font-size: 1.4rem; letter-spacing: 0.15em;
            color: transparent; background: linear-gradient(90deg,#fff1ff,#ffd9fb 40%, #a86bff 100%);
            -webkit-background-clip: text; background-clip: text; text-shadow: 0 4px 16px rgba(168,107,255,0.2);
        }
        .subtitle { display:block; font-size:0.8rem; color:#cdb9ff; opacity:0.7; letter-spacing:0.1em; margin-top: 4px; }

        /* ================= 播放器主体布局 ================= */
        .player-main {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 2rem 5%; gap: 4rem; max-width: 1400px; margin: 0 auto; width: 100%;
        }

        /* --- 左侧：星盘与舞台追光 --- */
        .visual-section {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; /* 为追光提供定位基准 */
            z-index: 1;
        }

        /* 新增：舞台追光特效 */
        .stage-lighting {
            position: absolute;
            top: -30vh;
            left: 50%;
            transform: translateX(-50%);
            width: min(900px, 140vw);
            height: 90vh;

            background:
                radial-gradient(ellipse at 50% 0%,
                    rgba(255,217,251,0.35) 0%,
                    rgba(255,217,251,0.18) 25%,
                    rgba(168,107,255,0.12) 45%,
                    rgba(168,107,255,0.05) 60%,
                    transparent 75%
                ),
                radial-gradient(ellipse at 50% 20%,
                    rgba(255,121,198,0.12) 0%,
                    transparent 70%
                );

            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;

            filter: blur(20px);
            opacity: 0.5;

            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            mask-image: linear-gradient(
                to right,
                transparent 0%,
                black 20%,
                black 80%,
                transparent 100%
            );
        }

        /* 播放时：光束亮起并开始律动 */
        .visual-section.playing .stage-lighting {
            opacity: 0.85;
            filter: blur(50px);
            animation: lightPulse 3s infinite alternate ease-in-out;
        }

        .visual-section.pausing .stage-lighting {
            opacity: 0;
            filter: blur(80px);
            animation: none;
            transition: opacity 0.6s ease, filter 0.6s ease;
        }

        @keyframes lightPulse {
            0% { opacity: 0.8; transform: translateX(-50%) scaleY(1); }
            50% { opacity: 1; transform: translateX(-50%) scaleY(1.02); filter: blur(15px) brightness(1.2); }
            100% { opacity: 0.85; transform: translateX(-50%) scaleY(1.01); }
        }

        /* 星盘本体 */
        .astrolabe-wrapper {
            position: relative; width: min(400px, 70vw); aspect-ratio: 1;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(10, 6, 20, 0.4); border: 1px solid rgba(168,107,255,0.15);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(168,107,255,0.1);
        }
        
        /* 增加顶部高光反射，配合追光 */
        .astrolabe-wrapper::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,217,251,0.1) 0%, transparent 30%);
            pointer-events: none; z-index: 10;
        }

        .astrolabe-wrapper::before {
            content: ''; position: absolute; inset: -20px; border-radius: 50%;
            border: 1px dashed rgba(255,121,198,0.2); animation: reverseSpin 30s linear infinite;
        }
        .vinyl-disc {
            width: 90%; height: 90%; border-radius: 50%; position: relative;
            background: conic-gradient(from 0deg, #110b1a, #24163b, #110b1a, #24163b, #110b1a);
            border: 2px solid rgba(168,107,255,0.3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s ease, opacity 0.5s ease, filter 0.5s ease;
            opacity: 0.98;
            animation: spin 12s linear infinite; animation-play-state: paused;
        }
        .vinyl-disc.playing { animation-play-state: running; opacity: 1; filter: brightness(1.08); }
        .vinyl-disc.pausing { opacity: 0.35; filter: brightness(0.75) blur(3px); }
        .vinyl-disc::after {
            content: ''; position: absolute; inset: 5%; border-radius: 50%; border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 0 0 10px rgba(0,0,0,0.1), inset 0 0 0 20px rgba(255,255,255,0.02), inset 0 0 0 40px rgba(0,0,0,0.1);
        }
        .disc-center {
            width: 30%; height: 30%; border-radius: 50%; z-index: 2;
            background: radial-gradient(circle, #ff79c6 0%, #763baf 70%, #110b1a 100%);
            box-shadow: 0 0 20px rgba(255,121,198,0.5); display: flex; align-items: center; justify-content: center;
        }
        .disc-center::before { content: '✦'; color: #fff; font-size: 1.5rem; text-shadow: 0 0 10px #fff; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes reverseSpin { 100% { transform: rotate(-360deg); } }

        /* --- 右侧：播放列表与残卷 --- */
        .info-section {
            flex: 1; max-width: 500px; display: flex; flex-direction: column; gap: 1.5rem; z-index: 10;
        }
        
        .glass-panel {
            background: linear-gradient(145deg, rgba(22,14,42,0.6), rgba(10,6,20,0.8)); 
            border: 1px solid rgba(168,107,255,0.15); border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 1.5rem; display: flex; flex-direction: column;
        }

        .panel-title { color: #ffd9fb; font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .panel-title::before { content: "✦"; color: #ff79c6; font-size: 0.9rem; }

        .playlist { list-style: none; max-height: 160px; overflow-y: auto; padding-right: 8px; margin-bottom: 0.5rem; }
        .track-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-radius: 12px; margin-bottom: 6px;
            background: rgba(255,255,255,0.02); transition: all 0.3s ease; border: 1px solid transparent;
        }
        .track-item:hover { background: rgba(168,107,255,0.1); border-color: rgba(168,107,255,0.2); }
        .track-item.active { background: rgba(168,107,255,0.2); border-color: rgba(255,121,198,0.4); box-shadow: 0 0 15px rgba(168,107,255,0.1); }
        .track-info { display: flex; flex-direction: column; gap: 4px; pointer-events: none;}
        .track-name { color: #e6e2ff; font-weight: 600; font-size: 1rem; }
        .track-item.active .track-name { color: #ff79c6; text-shadow: 0 0 8px rgba(255,121,198,0.4); }
        .track-author { color: #b89dff; font-size: 0.8rem; opacity: 0.7; }
        .track-duration { color: #a86bff; font-size: 0.85rem; font-family: monospace; }

        .lore-panel { max-height: 180px; }
        .lore-content {
            padding: 1rem; color: #e6e2ff; font-style: italic; line-height: 1.7;
            border-left: 2px solid #a86bff; background: rgba(0,0,0,0.3); border-radius: 0 8px 8px 0;
            font-size: 0.95rem; height: 100%; overflow-y: auto; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: opacity 0.4s ease;
        }

        /* ================= 底部控制栏 ================= */
        .bottom-controls {
            padding: 1rem 5% 3rem; width: 100%; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(0deg, rgba(4,3,7,1) 0%, rgba(10,6,20,0.8) 100%);
            border-top: 1px solid rgba(168,107,255,0.1); z-index: 10; position: relative;
        }

        .progress-wrapper {
            width: min(100%, 800px); display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem;
        }
        .time { font-family: monospace; font-size: 0.85rem; color: #d7d0ff; opacity: 0.8; width: 45px; text-align: center; }
        .progress-bar-container {
            flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); overflow: hidden; transition: height 0.2s;
            touch-action: pan-y; cursor: pointer;
        }
        .progress-bar-container:hover { height: 8px; background: rgba(255,255,255,0.12); }
        .progress-fill {
            height: 100%; width: 0%; border-radius: 3px;
            background: linear-gradient(90deg, #5c358f, #ff79c6);
            box-shadow: 0 0 10px rgba(255,121,198,0.6); position: relative; pointer-events: none;
        }

        .btn-group { display: flex; align-items: center; gap: 24px; }
        .ctrl-btn {
            background: transparent; border: none; color: #ffd9fb; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ctrl-btn:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 15px rgba(255,121,198,0.8); }
        .btn-side { width: 44px; height: 44px; background: rgba(168,107,255,0.1); }
        .btn-side:hover { background: rgba(168,107,255,0.25); box-shadow: 0 0 20px rgba(168,107,255,0.3); }
        
        .btn-play {
            width: 64px; height: 64px; background: linear-gradient(135deg, #9d4edd, #ff79c6);
            box-shadow: 0 8px 20px rgba(168,107,255,0.3), inset 0 0 10px rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-play:hover { transform: scale(1.08) translateY(-2px); box-shadow: 0 12px 30px rgba(255,121,198,0.5); }
        .btn-play svg { width: 28px; height: 28px; fill: currentColor; margin-left: 4px; }
        .btn-play.playing svg { margin-left: 0; }

        /* ================= 响应式适配增强 ================= */

        @media (max-width: 1024px) {
            .player-main { gap: 2.5rem; padding: 1.5rem 5%; }
            .astrolabe-wrapper { width: min(350px, 60vw); }
            .info-section { max-width: 450px; }
            .glass-panel { padding: 1.25rem; }
        }

        @media (max-width: 768px) {
            .top-nav { padding: 1.2rem 1.5rem; }
            .crux-word { font-size: 1.2rem; }
            .player-main { flex-direction: column; gap: 2rem; padding: 1rem 5%; }
            .visual-section { order: 1; }
            .info-section { order: 2; width: 100%; max-width: 100%; }
            .astrolabe-wrapper { width: min(300px, 70vw); }
            .stage-lighting { width: 140vw; top: -10vh; } /* 移动端调整光束比例 */
            .playlist { max-height: 140px; }
            .lore-panel { max-height: 150px; }
        }

        @media (max-width: 520px) {
            .top-nav { padding: 1rem 1.2rem; }
            .back-btn { font-size: 0.85rem; }
            .crux-word { font-size: 1.1rem; letter-spacing: 0.1em; }
            .subtitle { font-size: 0.7rem; }
            .player-main { padding: 0.5rem 4% 1.5rem; gap: 1.5rem; }
            .astrolabe-wrapper { width: min(240px, 75vw); }
            .disc-center::before { font-size: 1.2rem; }
            .glass-panel { padding: 1rem; border-radius: 16px; }
            .panel-title { font-size: 1rem; margin-bottom: 0.8rem; }
            .track-item { padding: 8px 10px; }
            .track-name { font-size: 0.95rem; }
            .track-author { font-size: 0.75rem; }
            .lore-content { font-size: 0.9rem; padding: 0.8rem; }
            .bottom-controls { padding: 1rem 4% 2.5rem; }
            .progress-wrapper { margin-bottom: 1.2rem; }
            .btn-group { gap: 20px; }
            .btn-play { width: 60px; height: 60px; }
            .btn-side { width: 44px; height: 44px; }
        }

        @media (max-width: 375px) {
            .astrolabe-wrapper { width: 200px; }
            .top-nav { padding: 0.8rem 1rem; }
            .crux-word { font-size: 1rem; }
            .btn-play { width: 56px; height: 56px; }
            .btn-side { width: 40px; height: 40px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .player-main { flex-direction: row; padding: 1rem 5%; }
            .astrolabe-wrapper { width: 40vh; }
            .stage-lighting { height: 120vh; top: -50vh; }
            .top-nav, .bottom-controls { padding: 0.5rem 5% 1rem; }
            .playlist { max-height: 100px; }
            .lore-panel { display: none; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <nav class="top-nav">

    <main class="player-main">

        <div class="btn-group">

                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="ctrl-btn btn-side" id="nextBtn" aria-label="下一首">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

    <audio id="audioPlayer"></audio>

    <script>
        const AUDIO_BASE = "https://pub-b9667cad2f06486ea4c99baea9493f16.r2.dev/musics/";
        const tracks = [

            lore: "“该音轨结构呈现周期性循环，但不存在明确的起点或终点。频谱分析显示，其每一轮‘回归’都会携带微小偏差，如同某种不断修正自身的系统。长时间监听后，部分人员出现时间感错乱现象——他们无法判断自己是否已经听过这一段。”"

        let currentTrackIdx = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const vinyl = document.getElementById('vinyl');
        const visualSection = document.getElementById('visualSection'); // 获取左侧容器用于光线联动
        const playlistEl = document.getElementById('playlist');
        const loreContent = document.getElementById('loreContent');

        function initPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `track-item ${index === currentTrackIdx ? 'active' : ''}`;
                li.dataset.index = index;
                li.innerHTML = `
                    <div class="track-info">
                        <span class="track-name">${track.name}</span>
                        <span class="track-author">${track.author}</span>
                    </div>
                    <span class="track-duration">${track.durationStr}</span>
                `;
                li.addEventListener('click', () => {
                    loadTrack(index);
                    playTrack();
                });
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            currentTrackIdx = index;
            const track = tracks[index];
            
            audio.src = track.src;
            audio.load(); 
            
            audio.onerror = () => {
                loreContent.innerHTML += `<br><br><span style="color:#ff4d4d;">[系统警告] 音频流断开，未能解析该残卷。请检查本地资源路径是否正确：${track.src}</span>`;
            };

            document.querySelectorAll('.track-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            loreContent.style.opacity = 0;
            setTimeout(() => {
                loreContent.innerHTML = track.lore;
                loreContent.style.opacity = 1;
            }, 300);

            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = track.durationStr; 
        }

        function playTrack() {
            playBtn.classList.add('playing');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            vinyl.classList.remove('pausing');
            visualSection.classList.remove('pausing');
            vinyl.classList.add('playing');
            visualSection.classList.add('playing'); // 播放时激活追光律动

            audio.play().catch(e => {
                console.log("请点击页面任意位置授权音频播放:", e);
            });
        }

        function pauseTrack() {
            audio.pause();
            playBtn.classList.remove('playing');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            vinyl.classList.add('pausing');
            visualSection.classList.add('pausing');
            setTimeout(() => {
                vinyl.classList.remove('playing', 'pausing');
                visualSection.classList.remove('playing', 'pausing');
            }, 600);
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) playTrack();
            else pauseTrack();
        });

        prevBtn.addEventListener('click', () => {
            let newIdx = currentTrackIdx - 1;
            if (newIdx < 0) newIdx = tracks.length - 1;
            loadTrack(newIdx);
            playTrack();
        });

        nextBtn.addEventListener('click', () => {
            let newIdx = currentTrackIdx + 1;
            if (newIdx >= tracks.length) newIdx = 0;
            loadTrack(newIdx);
            playTrack();
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && isFinite(audio.duration)) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const total = audio.duration;
            if (total && isFinite(total)) {
                const percent = (current / total) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(current);
            }
        });

        let isSeeking = false;
        function seekToPosition(clientX) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (clientX - rect.left) / rect.width;
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = Math.min(Math.max(pos, 0), 1) * audio.duration;
            }
        }

        progressBar.addEventListener('click', (e) => {
            seekToPosition(e.clientX);
        });

        progressBar.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isSeeking = true;
            progressBar.setPointerCapture(e.pointerId);
            seekToPosition(e.clientX);
        });

        progressBar.addEventListener('pointermove', (e) => {
            if (!isSeeking) return;
            seekToPosition(e.clientX);
        });

        progressBar.addEventListener('pointerup', (e) => {
            if (!isSeeking) return;
            isSeeking = false;
            progressBar.releasePointerCapture(e.pointerId);
            seekToPosition(e.clientX);
        });

        progressBar.addEventListener('pointercancel', () => {
            isSeeking = false;
        });

        document.addEventListener('pointerup', () => {
            isSeeking = false;
        });

        (function initVisuals() {
            const particlesWrap = document.getElementById('particles');
            for(let i=0; i<20; i++){
                const p = document.createElement('div'); 
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%'; 
                p.style.top = Math.random()*100 + '%';
                const s = 3 + Math.random()*5; 
                p.style.width = s+'px'; p.style.height = s+'px';
                p.style.animationDuration = (5000 + Math.random()*8000) + 'ms';
                p.style.animationDelay = (Math.random()*3000) + 'ms';
                particlesWrap.appendChild(p);
            }

            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if(!isTouch) {
                const cvs = document.createElement('canvas');
                cvs.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999;';
                document.body.appendChild(cvs);
                const ctx = cvs.getContext('2d');
                let w = window.innerWidth, h = window.innerHeight;
                cvs.width = w; cvs.height = h;

                window.addEventListener('resize', () => { w = window.innerWidth; h = window.innerHeight; cvs.width = w; cvs.height = h; });

                const mouse = { x: w/2, y: h/2, tx: w/2, ty: h/2 };
                let history = [];
                let hoverState = false;
                let clickScale = 1;
                let starRotation = 0; 

                window.addEventListener('mousemove', e => { mouse.tx = e.clientX; mouse.ty = e.clientY; });

                document.addEventListener('mouseover', e => {
                    if(e.target.closest('button') || e.target.closest('a') || e.target.closest('.track-item') || e.target.closest('#progressBar')) {
                        hoverState = true;
                    } else { hoverState = false; }
                });

                document.addEventListener('mousedown', () => clickScale = 0.6);
                document.addEventListener('mouseup', () => { clickScale = 1.3; setTimeout(() => clickScale = 1, 150); });

                function drawStar(cx, cy, outer, inner, color, glow, rotOffset) {
                    let rot = (Math.PI / 2 * 3) + rotOffset;
                    let step = Math.PI / 4; 
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer); rot += step;
                        ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner); rot += step;
                    }
                    ctx.closePath();
                    if(glow) { ctx.shadowBlur = 15; ctx.shadowColor = glow; } else { ctx.shadowBlur = 0; }
                    ctx.fillStyle = color; ctx.fill(); ctx.shadowBlur = 0;
                }

                function renderCursor() {
                    ctx.clearRect(0, 0, w, h);
                    mouse.x += (mouse.tx - mouse.x) * 0.45; mouse.y += (mouse.ty - mouse.y) * 0.45;
                    history.push({x: mouse.x, y: mouse.y});
                    if(history.length > 12) history.shift();

                    if (history.length > 2) {
                        ctx.beginPath();
                        ctx.moveTo(history[0].x, history[0].y);
                        for (let i = 1; i < history.length - 1; i++) {
                            const xc = (history[i].x + history[i + 1].x) / 2;
                            const yc = (history[i].y + history[i + 1].y) / 2;
                            ctx.quadraticCurveTo(history[i].x, history[i].y, xc, yc);
                        }
                        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                        const grad = ctx.createLinearGradient(history[0].x, history[0].y, mouse.x, mouse.y);
                        grad.addColorStop(0, 'rgba(168, 107, 255, 0)');
                        grad.addColorStop(1, 'rgba(255, 121, 198, 0.7)');
                        ctx.strokeStyle = grad; ctx.lineWidth = hoverState ? 3 : 1.5; ctx.stroke();
                    }

                    starRotation += hoverState ? 0.04 : 0.005;
                    let targetOuter = (hoverState ? 18 : 12) * clickScale;
                    let targetInner = (hoverState ? 6 : 3) * clickScale;

                    drawStar(mouse.x, mouse.y, targetOuter + 4, targetInner + 2, 'rgba(168, 107, 255, 0.3)', 'rgba(255, 121, 198, 0.5)', starRotation);
                    drawStar(mouse.x, mouse.y, targetOuter, targetInner, '#ffffff', '#ff79c6', starRotation);

                    requestAnimationFrame(renderCursor);
                }
                renderCursor();
            }
        })();

        initPlaylist();
        loadTrack(0);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 融合系统状态栏颜色 -->
    <meta name="theme-color" content="#040307">
    <title>南十字留声机 | 末世回响</title>
    <link rel="icon" type="image/png" href="南十字Crux.png">
    <link rel="apple-touch-icon" href="南十字Crux.png">
    <style>
        /* ================= 基础全局与美术风格传承 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @media (pointer: fine) { * { cursor: none !important; } }

        html, body { height: 100vh; height: 100dvh; overscroll-behavior: none; }
        
        body {
            background: #040307;
            color: #e6e2ff;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }

        button, .progress-bar-container, .track-item, a {
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle at 15% 20%, rgba(255,255,255,0.05), transparent 25%),
                        radial-gradient(circle at 85% 75%, rgba(173,84,255,0.08), transparent 25%),
                        linear-gradient(160deg, rgba(86,50,162,0.1), transparent 45%, rgba(3,2,8,0.8));
            pointer-events: none; z-index: -2;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,107,255,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,121,198,0.7); }

        .particles { position:fixed; inset:0; pointer-events:none; z-index:-1; }
        .particle {
            position:absolute; width:4px; height:4px; border-radius:50%;
            background: radial-gradient(circle, #fff7ff 0%, #ffd9fb 40%, #a86bff 100%);
            opacity:0.8; transform: translate3d(0,0,0);
            box-shadow: 0 0 10px rgba(168,107,255,0.5);
            animation: floatAnim ease-in-out infinite alternate;
        }
        @keyframes floatAnim { 0% { transform: translate3d(0, 0, 0); opacity: 0.5; } 100% { transform: translate3d(10px, -15px, 0); opacity: 1; } }

        /* ================= 舞台全局追光 (JS联动锁定星盘) ================= */
        .stage-lighting {
            position: fixed; 
            top: -10vh; 
            left: 50vw; /* 初始值，JS会瞬间接管并锁定星盘 */
            transform: translateX(-50%);
            width: min(1000px, 150vw); 
            height: 110vh;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255,217,251,0.35) 0%, rgba(255,217,251,0.15) 25%, rgba(168,107,255,0.1) 45%, transparent 70%),
                radial-gradient(ellipse at 50% 20%, rgba(255,121,198,0.12) 0%, transparent 60%);
            pointer-events: none; 
            z-index: 0; 
            mix-blend-mode: screen; 
            filter: blur(25px); 
            opacity: 0.4;
            /* left属性加上平滑过渡，让窗口缩放时追光像探照灯一样滑过去 */
            transition: left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease, filter 0.8s ease;
            mask-image: linear-gradient(to right, transparent 0%, black 25%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 25%, black 75%, transparent 100%);
        }
        .stage-lighting.playing { opacity: 0.85; filter: blur(35px); animation: lightPulse 3s infinite alternate ease-in-out; }
        .stage-lighting.pausing { opacity: 0; filter: blur(60px); animation: none; transition: opacity 0.6s ease, filter 0.6s ease; }
        @keyframes lightPulse {
            0% { opacity: 0.75; transform: translateX(-50%) scaleY(1); }
            50% { opacity: 1; transform: translateX(-50%) scaleY(1.03); filter: blur(20px) brightness(1.2); }
            100% { opacity: 0.85; transform: translateX(-50%) scaleY(1.01); }
        }

        /* ================= 导航与顶栏 ================= */
        .top-nav {
            padding: calc(1rem + env(safe-area-inset-top, 0px)) 2.4rem 1rem; 
            display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 20;
            background: linear-gradient(180deg, rgba(4,3,7,0.85) 0%, rgba(4,3,7,0) 100%);
        }
        .back-btn {
            display: flex; align-items: center; gap: 8px; color: #ffd8fb; text-decoration: none;
            font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; opacity: 0.8;
            transition: all 0.3s ease; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .back-btn:hover { opacity: 1; text-shadow: 0 0 12px rgba(255,121,198,0.8); transform: translateX(-4px); }
        .back-icon { font-size: 1.2rem; margin-bottom: 2px; }

        .header-title { text-align: right; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .crux-word {
            font-family: "PingFang SC", 'Times New Roman', serif; font-weight: 600; font-size: 1.4rem; letter-spacing: 0.15em;
            color: transparent; background: linear-gradient(90deg,#fff1ff,#ffd9fb 40%, #a86bff 100%);
            -webkit-background-clip: text; background-clip: text; text-shadow: 0 4px 16px rgba(168,107,255,0.4);
        }
        .subtitle { display:block; font-size:0.8rem; color:#cdb9ff; opacity:0.8; letter-spacing:0.1em; margin-top: 4px; }

        /* ================= 播放器主体布局 ================= */
        .player-main {
            flex: 1; display: flex; align-items: flex-start; justify-content: center;
            padding: 2rem 5%; gap: 4rem; max-width: 1400px; margin: 0 auto; width: 100%;
            overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
            position: relative; z-index: 10;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 2%, black 98%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 2%, black 98%, transparent 100%);
        }
        .player-main::-webkit-scrollbar { width: 0; }

        .visual-section { flex: 1; display: flex; flex-direction: column; align-items: center; margin: auto 0; }
        .info-section { flex: 1; max-width: 500px; display: flex; flex-direction: column; gap: 1.5rem; margin: auto 0; padding-bottom: 2rem; }

        /* --- 左侧：星盘 --- */
        .astrolabe-wrapper {
            position: relative; width: min(400px, 70vw); aspect-ratio: 1;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(10, 6, 20, 0.4); border: 1px solid rgba(168,107,255,0.15);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(168,107,255,0.1);
        }
        /* 承接天光的高光反射层 */
        .astrolabe-wrapper::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,217,251,0.25) 0%, transparent 40%);
            pointer-events: none; z-index: 10; mix-blend-mode: screen; transition: opacity 0.5s ease; opacity: 0.3;
        }
        .visual-section.playing .astrolabe-wrapper::after { opacity: 0.8; }

        .astrolabe-wrapper::before {
            content: ''; position: absolute; inset: -20px; border-radius: 50%;
            border: 1px dashed rgba(255,121,198,0.2); animation: reverseSpin 30s linear infinite;
        }
        .vinyl-disc {
            width: 90%; height: 90%; border-radius: 50%; position: relative;
            background: conic-gradient(from 0deg, #110b1a, #24163b, #110b1a, #24163b, #110b1a);
            border: 2px solid rgba(168,107,255,0.3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s ease, opacity 0.5s ease, filter 0.5s ease;
            opacity: 0.98; animation: spin 12s linear infinite; animation-play-state: paused;
        }
        .vinyl-disc.playing { animation-play-state: running; opacity: 1; filter: brightness(1.1); }
        .vinyl-disc.pausing { opacity: 0.35; filter: brightness(0.7) blur(3px); }
        .vinyl-disc::after {
            content: ''; position: absolute; inset: 5%; border-radius: 50%; border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 0 0 10px rgba(0,0,0,0.1), inset 0 0 0 20px rgba(255,255,255,0.02), inset 0 0 0 40px rgba(0,0,0,0.1);
        }
        .disc-center {
            width: 30%; height: 30%; border-radius: 50%; z-index: 2;
            background: radial-gradient(circle, #ff79c6 0%, #763baf 70%, #110b1a 100%);
            box-shadow: 0 0 20px rgba(255,121,198,0.5); display: flex; align-items: center; justify-content: center;
        }
        .disc-center::before { content: '✦'; color: #fff; font-size: 1.5rem; text-shadow: 0 0 10px #fff; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes reverseSpin { 100% { transform: rotate(-360deg); } }

        /* --- 右侧：播放列表与残卷 --- */
        .glass-panel {
            background: linear-gradient(145deg, rgba(22,14,42,0.45), rgba(10,6,20,0.7)); 
            border: 1px solid rgba(168,107,255,0.15); border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 1.5rem; display: flex; flex-direction: column;
        }

        .panel-title { color: #ffd9fb; font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .panel-title::before { content: "✦"; color: #ff79c6; font-size: 0.9rem; }

        .playlist { list-style: none; max-height: 280px; overflow-y: auto; padding-right: 8px; margin-bottom: 0.5rem; }
        
        .track-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; border-radius: 14px; margin-bottom: 6px;
            background: rgba(255,255,255,0.02); transition: all 0.3s ease; border: 1px solid transparent; cursor: pointer;
        }
        .track-item:hover { background: rgba(168,107,255,0.1); border-color: rgba(168,107,255,0.2); }
        .track-item.active { background: rgba(168,107,255,0.25); border-color: rgba(255,121,198,0.35); box-shadow: 0 0 15px rgba(168,107,255,0.15); }
        
        .track-info { display: flex; flex-direction: column; gap: 4px; pointer-events: none;}
        .track-name { color: #e6e2ff; font-weight: 600; font-size: 1rem; transition: color 0.3s; }
        
        @keyframes activeTrackPulse {
            0% { opacity: 0.9; text-shadow: 0 0 8px rgba(255,121,198,0.4); }
            100% { opacity: 1; text-shadow: 0 0 15px rgba(255,121,198,0.8), 0 0 20px rgba(168,107,255,0.5); }
        }
        .track-item.active .track-name { color: #ffd9fb; animation: activeTrackPulse 2s infinite alternate ease-in-out; }
        .track-author { color: #b89dff; font-size: 0.8rem; opacity: 0.7; }
        .track-duration { color: #a86bff; font-size: 0.85rem; font-family: monospace; }

        .lore-panel { max-height: 220px; overflow: hidden; display: flex; flex-direction: column; }
        .lore-content {
            padding: 1rem; color: #e6e2ff; font-style: italic; line-height: 1.7;
            border-left: 2px solid #a86bff; background: rgba(0,0,0,0.3); border-radius: 0 8px 8px 0;
            font-size: 0.95rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translateY(0); flex: 1; overflow-y: auto;
        }
        .lore-content.fade-out { opacity: 0; transform: translateY(8px); }

        /* ================= 底部沉浸式控制栏 ================= */
        .bottom-controls {
            padding: 1.2rem 5% calc(1.5rem + env(safe-area-inset-bottom, 0px)); width: 100%; 
            display: flex; flex-direction: column; align-items: center;
            background: rgba(8, 5, 14, 0.75);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(168,107,255,0.2); z-index: 20; position: relative;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .progress-wrapper {
            width: min(100%, 800px); display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem;
        }
        .time { font-family: monospace; font-size: 0.85rem; color: #d7d0ff; opacity: 0.8; width: 45px; text-align: center; }
        .progress-bar-container {
            flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); overflow: hidden; transition: height 0.2s;
            touch-action: none; cursor: pointer;
        }
        .progress-bar-container:hover { height: 8px; background: rgba(255,255,255,0.15); }
        .progress-fill {
            height: 100%; width: 0%; border-radius: 4px;
            background: linear-gradient(90deg, #5c358f, #ff79c6);
            box-shadow: 0 0 12px rgba(255,121,198,0.7); position: relative; pointer-events: none;
        }

        .btn-group { display: flex; align-items: center; gap: 24px; }
        .ctrl-btn {
            background: transparent; border: none; color: #ffd9fb; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ctrl-btn:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 15px rgba(255,121,198,0.8); }
        .btn-side { width: 44px; height: 44px; background: rgba(168,107,255,0.1); }
        .btn-side:hover { background: rgba(168,107,255,0.25); box-shadow: 0 0 20px rgba(168,107,255,0.3); }
        
        .btn-play {
            width: 64px; height: 64px; background: linear-gradient(135deg, #9d4edd, #ff79c6);
            box-shadow: 0 8px 20px rgba(168,107,255,0.3), inset 0 0 10px rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-play:hover { transform: scale(1.08) translateY(-2px); box-shadow: 0 12px 30px rgba(255,121,198,0.5); }
        .btn-play svg { width: 28px; height: 28px; fill: currentColor; margin-left: 4px; }
        .btn-play.playing svg { margin-left: 0; }

        /* ================= 移动端响应式核心优化 ================= */

        @media (max-width: 1024px) {
            .player-main { gap: 2.5rem; padding: 1rem 4% 2rem; }
            .astrolabe-wrapper { width: min(340px, 45vw); }
            .info-section { max-width: 50%; }
        }

        @media (max-width: 768px) {
            .top-nav { padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem 0.5rem; }
            .player-main { flex-direction: column; gap: 2rem; padding: 1rem 5% 6rem; }
            .visual-section { order: 1; width: 100%; margin-top: 1rem; flex-shrink: 0; }
            .info-section { order: 2; width: 100%; max-width: 100%; flex-shrink: 0; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 0; }
            .astrolabe-wrapper { width: min(320px, 65vw); }
            .playlist { max-height: none; overflow: visible; margin-bottom: 0; }
            .lore-panel { max-height: none; overflow: visible; }
            .lore-content { max-height: none; overflow: visible; }
        }

        @media (max-width: 520px) {
            .top-nav { padding: calc(0.8rem + env(safe-area-inset-top, 0px)) 1.2rem 0.5rem; }
            .back-btn { font-size: 0.85rem; }
            .crux-word { font-size: 1.15rem; letter-spacing: 0.1em; }
            .player-main { padding: 0.5rem 5% 3rem; gap: 1.8rem; }
            .astrolabe-wrapper { width: min(260px, 75vw); }
            .disc-center::before { font-size: 1.2rem; }
            .glass-panel { padding: 1.2rem; border-radius: 20px; }
            .panel-title { font-size: 1rem; margin-bottom: 0.8rem; }
            .track-item { padding: 12px 14px; border-radius: 12px; }
            .track-name { font-size: 0.95rem; }
            .track-author { font-size: 0.75rem; }
            .lore-content { font-size: 0.9rem; padding: 0.8rem; }
            .bottom-controls { padding: 1.2rem 5% calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
            .progress-wrapper { margin-bottom: 1.2rem; }
            .btn-group { gap: 20px; }
            .btn-play { width: 60px; height: 60px; }
            .btn-side { width: 44px; height: 44px; }
        }

        @media (max-width: 375px) {
            .astrolabe-wrapper { width: 220px; }
            .btn-play { width: 54px; height: 54px; }
            .btn-side { width: 40px; height: 40px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .player-main { flex-direction: row; padding: 0.5rem 5% 1rem; align-items: center; gap: 2rem; }
            .astrolabe-wrapper { width: 45vh; }
            .top-nav { padding: env(safe-area-inset-top, 0.5rem) 5% 0.5rem; }
            .bottom-controls { padding: 0.8rem 5% calc(0.8rem + env(safe-area-inset-bottom, 0px)); }
            .playlist { max-height: 160px; overflow-y: auto; }
            .lore-panel { display: none; } 
        }
    </style>
</head>
<body>

    <!-- 舞台追光，依靠 JS 动态计算锁定星盘位置 -->
    <div class="stage-lighting" id="stageLighting"></div>

    <div class="particles" id="particles"></div>

    <nav class="top-nav">
        <a href="./index.html" class="back-btn">
            <span class="back-icon">←</span> 返回秘所
        </a>
        <div class="header-title">
            <div class="crux-word">南十字留声机</div>
            <div class="subtitle">ECHOES OF THE END</div>
        </div>
    </nav>

    <main class="player-main">
        <section class="visual-section" id="visualSection">
            <div class="astrolabe-wrapper" id="astrolabe">
                <div class="vinyl-disc" id="vinyl">
                    <div class="disc-center"></div>
                </div>
            </div>
        </section>

        <section class="info-section">
            <div class="glass-panel">
                <div class="panel-title">星轨残片 · 收录曲目</div>
                <ul class="playlist" id="playlist"></ul>
            </div>

            <div class="glass-panel lore-panel">
                <div class="panel-title">远古残卷 · 意象解构</div>
                <div class="lore-content" id="loreContent">
                    点击曲目以聆听深渊中的回响，此处将显现遗失的箴言...
                </div>
            </div>
        </section>
    </main>

    <footer class="bottom-controls">
        <div class="progress-wrapper">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-bar-container" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time" id="totalTime">0:00</span>
        </div>
        
        <div class="btn-group">
            <button class="ctrl-btn btn-side" id="prevBtn" aria-label="上一首">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn btn-play" id="playBtn" aria-label="播放/暂停">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="ctrl-btn btn-side" id="nextBtn" aria-label="下一首">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </footer>

    <audio id="audioPlayer"></audio>

    <script>
        const AUDIO_BASE = "https://pub-b9667cad2f06486ea4c99baea9493f16.r2.dev/musics/";
        const tracks = [
            { name: "海愿", author: "塞壬唱片-MSR, Eagle Wei", src: AUDIO_BASE + "haiyuan.flac", durationStr: "2:20", lore: "“我们在深空边缘捕捉到了这些频段。它不像是星体崩塌的噪音，更像是有某种巨大之物在虚空中喘息。切记，不要在深夜里把音量调到最大。”" },
            { name: "See you soon", author: "塞壬唱片-MSR, 柳川和樹", src: AUDIO_BASE + "seeyousoon.flac", durationStr: "2:38", lore: "旧日骑士们踏过被畸变侵蚀的荒原，他们的盔甲摩擦声在冷风中化作了这首绝望而悲壮的挽歌。星轨已然偏航，唯有火光不可熄灭。" },
            { name: "Gwyn, Lord of Cinder", author: "桜庭統", src: AUDIO_BASE + "Gwyn, Lord of Cinder.mp3", durationStr: "3:38", lore: "“该频段呈现出稳定的低频燃烧噪声...记录员报告称，他在静音后仍能听见火焰。”" },
            { name: "走过漫漫长路", author: "塞壬唱片-MSR", src: AUDIO_BASE + "kal'tsit.flac", durationStr: "2:10", lore: "“音轨中存在异常稳定的心跳节律，与环境噪声完全解耦。医疗组建议停止长时间监听，但仍有志愿者声称，这段旋律在某种程度上‘维持了他们的清醒’。”" },
            { name: "Nameless Song", author: "桜庭統", src: AUDIO_BASE + "Nameless Song.flac", durationStr: "6:40", lore: "“该样本无文件源头，无编码痕迹...最令人不安的是，多名监听者在记录报告中写下了同一句话——‘这段旋律似乎早已存在于我的记忆中’。”" },
            { name: "生命流", author: "Starlight Oracle", src: AUDIO_BASE + "shengmingliu.flac", durationStr: "4:11", lore: "“长时间监听后，部分人员出现时间感错乱现象——他们无法判断自己是否已经听过这一段。”" }
        ];

        let currentTrackIdx = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const vinyl = document.getElementById('vinyl');
        const visualSection = document.getElementById('visualSection');
        const stageLighting = document.getElementById('stageLighting'); 
        const astrolabe = document.getElementById('astrolabe'); // 用于追踪的核心目标
        const playlistEl = document.getElementById('playlist');
        const loreContent = document.getElementById('loreContent');

        // ================= 核心：让追光动态锁定星盘中心 =================
        function syncLightingPosition() {
            if (!astrolabe || !stageLighting) return;
            const rect = astrolabe.getBoundingClientRect();
            // 计算星盘在当前屏幕视口中的横向中心点
            const centerX = rect.left + (rect.width / 2);
            stageLighting.style.left = `${centerX}px`;
        }

        // 初始化和窗口大小改变时，重新瞄准星盘
        window.addEventListener('resize', syncLightingPosition);
        // 初始化延时调用，确保DOM渲染完毕
        setTimeout(syncLightingPosition, 50);
        setTimeout(syncLightingPosition, 300);

        function initPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `track-item ${index === currentTrackIdx ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="track-info">
                        <span class="track-name">${track.name}</span>
                        <span class="track-author">${track.author}</span>
                    </div>
                    <span class="track-duration">${track.durationStr}</span>
                `;
                li.addEventListener('click', () => {
                    if(currentTrackIdx !== index) {
                        loadTrack(index);
                        playTrack();
                    }
                });
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            currentTrackIdx = index;
            const track = tracks[index];
            
            audio.src = track.src;
            audio.load(); 
            
            document.querySelectorAll('.track-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            loreContent.classList.add('fade-out');
            setTimeout(() => {
                loreContent.innerHTML = track.lore;
                loreContent.classList.remove('fade-out');
            }, 300);

            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = track.durationStr; 
        }

        function playTrack() {
            syncLightingPosition(); // 每次点击播放时，确保光追准了
            playBtn.classList.add('playing');
            playIcon.style.display = 'none'; pauseIcon.style.display = 'block';
            vinyl.classList.remove('pausing'); stageLighting.classList.remove('pausing'); visualSection.classList.remove('pausing');
            vinyl.classList.add('playing'); stageLighting.classList.add('playing'); visualSection.classList.add('playing');
            audio.play().catch(e => console.log("等待授权:", e));
        }

        function pauseTrack() {
            audio.pause();
            playBtn.classList.remove('playing');
            playIcon.style.display = 'block'; pauseIcon.style.display = 'none';
            vinyl.classList.add('pausing'); stageLighting.classList.add('pausing'); visualSection.classList.add('pausing');
            setTimeout(() => {
                vinyl.classList.remove('playing', 'pausing');
                stageLighting.classList.remove('playing', 'pausing');
                visualSection.classList.remove('playing', 'pausing');
            }, 600);
        }

        playBtn.addEventListener('click', () => audio.paused ? playTrack() : pauseTrack());
        prevBtn.addEventListener('click', () => { loadTrack(currentTrackIdx - 1 < 0 ? tracks.length - 1 : currentTrackIdx - 1); playTrack(); });
        nextBtn.addEventListener('click', () => { loadTrack(currentTrackIdx + 1 >= tracks.length ? 0 : currentTrackIdx + 1); playTrack(); });
        audio.addEventListener('ended', () => nextBtn.click());

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60).toString().padStart(2, '0')}`;
        }

        audio.addEventListener('loadedmetadata', () => { if (audio.duration && isFinite(audio.duration)) totalTimeEl.textContent = formatTime(audio.duration); });
        audio.addEventListener('timeupdate', () => {
            if (audio.duration && isFinite(audio.duration)) {
                progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        let isSeeking = false;
        function seekToPosition(clientX) {
            const rect = progressBar.getBoundingClientRect();
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1) * audio.duration;
            }
        }
        progressBar.addEventListener('pointerdown', (e) => { e.preventDefault(); isSeeking = true; progressBar.setPointerCapture(e.pointerId); seekToPosition(e.clientX); });
        progressBar.addEventListener('pointermove', (e) => { if (isSeeking) seekToPosition(e.clientX); });
        progressBar.addEventListener('pointerup', (e) => { if (isSeeking) { isSeeking = false; progressBar.releasePointerCapture(e.pointerId); seekToPosition(e.clientX); }});
        progressBar.addEventListener('pointercancel', () => isSeeking = false);
        
        (function initVisuals() {
            const particlesWrap = document.getElementById('particles');
            for(let i=0; i<20; i++){
                const p = document.createElement('div'); p.className = 'particle';
                p.style.left = Math.random()*100 + '%'; p.style.top = Math.random()*100 + '%';
                const s = 3 + Math.random()*5; p.style.width = s+'px'; p.style.height = s+'px';
                p.style.animationDuration = (5000 + Math.random()*8000) + 'ms'; p.style.animationDelay = (Math.random()*3000) + 'ms';
                particlesWrap.appendChild(p);
            }

            if(!(('ontouchstart' in window) || navigator.maxTouchPoints > 0)) {
                const cvs = document.createElement('canvas');
                cvs.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999;';
                document.body.appendChild(cvs);
                const ctx = cvs.getContext('2d');
                let w = window.innerWidth, h = window.innerHeight; cvs.width = w; cvs.height = h;
                
                window.addEventListener('resize', () => { 
                    w = window.innerWidth; h = window.innerHeight; cvs.width = w; cvs.height = h; 
                });

                const mouse = { x: w/2, y: h/2, tx: w/2, ty: h/2 }; let history = [], hoverState = false, clickScale = 1, starRotation = 0; 
                window.addEventListener('mousemove', e => { mouse.tx = e.clientX; mouse.ty = e.clientY; });
                document.addEventListener('mouseover', e => { hoverState = !!(e.target.closest('button') || e.target.closest('a') || e.target.closest('.track-item') || e.target.closest('#progressBar')); });
                document.addEventListener('mousedown', () => clickScale = 0.6);
                document.addEventListener('mouseup', () => { clickScale = 1.3; setTimeout(() => clickScale = 1, 150); });

                function renderCursor() {
                    ctx.clearRect(0, 0, w, h);
                    mouse.x += (mouse.tx - mouse.x) * 0.45; mouse.y += (mouse.ty - mouse.y) * 0.45;
                    history.push({x: mouse.x, y: mouse.y}); if(history.length > 12) history.shift();
                    
                    if (history.length > 2) {
                        ctx.beginPath(); ctx.moveTo(history[0].x, history[0].y);
                        for (let i = 1; i < history.length - 1; i++) ctx.quadraticCurveTo(history[i].x, history[i].y, (history[i].x + history[i+1].x)/2, (history[i].y + history[i+1].y)/2);
                        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                        const grad = ctx.createLinearGradient(history[0].x, history[0].y, mouse.x, mouse.y);
                        grad.addColorStop(0, 'rgba(168, 107, 255, 0)'); grad.addColorStop(1, 'rgba(255, 121, 198, 0.7)');
                        ctx.strokeStyle = grad; ctx.lineWidth = hoverState ? 3 : 1.5; ctx.stroke();
                    }

                    starRotation += hoverState ? 0.04 : 0.005;
                    let to = (hoverState ? 18 : 12) * clickScale, ti = (hoverState ? 6 : 3) * clickScale;
                    
                    const drawS = (o, i, c, g, r) => {
                        ctx.beginPath(); let rot = (Math.PI / 2 * 3) + r, step = Math.PI / 4; 
                        ctx.moveTo(mouse.x + Math.cos(rot)*o, mouse.y + Math.sin(rot)*o);
                        for(let k=0; k<4; k++) { ctx.lineTo(mouse.x + Math.cos(rot)*o, mouse.y + Math.sin(rot)*o); rot += step; ctx.lineTo(mouse.x + Math.cos(rot)*i, mouse.y + Math.sin(rot)*i); rot += step; }
                        ctx.closePath(); if(g) { ctx.shadowBlur = 15; ctx.shadowColor = g; } else ctx.shadowBlur = 0; ctx.fillStyle = c; ctx.fill(); ctx.shadowBlur = 0;
                    };
                    drawS(to + 4, ti + 2, 'rgba(168, 107, 255, 0.3)', 'rgba(255, 121, 198, 0.5)', starRotation);
                    drawS(to, ti, '#ffffff', '#ff79c6', starRotation);
                    requestAnimationFrame(renderCursor);
                }
                renderCursor();
            }
        })();

        initPlaylist();
        loadTrack(0);
    </script>
</body>
</html>
